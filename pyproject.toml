# 这个文件定义 mini-infer 的打包和测试基础配置。
[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-infer"
version = "0.1.0"
description = "面向 Qwen2.5 类 decoder-only 模型的推理系统学习项目，实现 Paged KV Cache、Continuous Batching、True PagedAttention、Preemption 和 Chat Completions 子集兼容 HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "pc" }
]
dependencies = [
    "torch>=2.1.2",
    "transformers>=4.40.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",  # Phase 8 async server tests
    "httpx>=0.24.0",            # Phase 8 ASGI test client
    "asgi-lifespan>=2.0",       # Phase 8 lifespan event triggering in tests
]
# Phase 6+：True PagedAttention（需先单独安装：pip install "flash-attn>=2.5.0" --no-build-isolation）
flash = [
    "flash-attn>=2.5.0",
]
# Phase 8+：HTTP 服务化
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "asgi-lifespan>=2.0",  # 测试用，触发 ASGI lifespan 事件
]

[tool.setuptools.packages.find]
include = ["mini_infer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
